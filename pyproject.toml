[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-shock-map"
version = "0.1.0"
description = "Evidence-linked supply-chain shock propagation and an auditable prediction ledger"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "yfinance>=0.2.65,<2", "requests>=2.31,<3", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "networkx>=3.2,<4", "structlog>=24,<26", "pydantic>=2,<3", "tqdm>=4.66,<5", "tenacity>=8,<10", "jcs>=0.2,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
scsm = "scsm.__main__:main"

[tool.setuptools.packages.find]
include = ["scsm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
