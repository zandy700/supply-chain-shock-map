name: Daily prediction ledger
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prediction-ledger
  cancel-in-progress: false
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Ingest news and append new predictions
        run: |
          python -m scsm ledger verify
          python -m scsm ingest
          python -m scsm ledger append
      - name: Score complete windows and rebuild static assets
        run: |
          python -m scsm score --online
          python -m scsm export
          python -m scsm ledger verify
          pytest -q
      - name: Commit ledger and cached assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger data/events data/prices web/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily predictions, matured outcomes and static data'
            git push
          fi
