name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m scsm ledger verify
      - name: Verify committed static data builds offline
        run: |
          python -m scsm export
          git diff --exit-code -- web/data
          test -z "$(git ls-files --others --exclude-standard web/data)"
