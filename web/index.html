<script>
/* Follow the Analyzer's theme (space:prefs.theme) before first paint, and keep in sync across tabs. */
(function () {
  var root = document.documentElement, THEMES = ['dark', 'light', 'blue-steel'];
  var mql = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
  function pref() {
    try { var p = JSON.parse(localStorage.getItem('space:prefs')); return p && typeof p.theme === 'string' ? p.theme : 'dark'; }
    catch (e) { return 'dark'; }
  }
  function apply() {
    var t = pref();
    if (t === 'system') t = mql && mql.matches ? 'light' : 'dark';
    root.dataset.spaceTheme = THEMES.indexOf(t) < 0 ? 'dark' : t;
    try { var p = JSON.parse(localStorage.getItem('space:prefs')); root.dataset.spaceDensity = p && p.density === 'compact' ? 'compact' : 'comfortable'; }
    catch (e) { root.dataset.spaceDensity = 'comfortable'; }
    var meta = document.querySelector('meta[name="theme-color"]');
    var surface = getComputedStyle(root).getPropertyValue('--s-surface').trim();
    if (meta && surface) meta.setAttribute('content', surface);
  }
  apply();
  addEventListener('storage', function (e) { if (e.key === 'space:prefs' || e.key === null) apply(); });
  if (mql) { var onChange = function () { if (pref() === 'system') apply(); }; mql.addEventListener ? mql.addEventListener('change', onChange) : mql.addListener && mql.addListener(onChange); }
  addEventListener('pageshow', apply);
  window.ultimaterApplyTheme = apply;
})();
</script>
